name: loop
# Runs chain themselves: each dispatches the next as it finishes (~16 min apart; ~90/day × 6 writes fits the free KV budget of 1000/day).
# A failed run waits out a 20-minute slot first, so a broken run cannot spin. No cron: GitHub's is best-effort.
on:
  workflow_dispatch:
run-name: full
permissions:
  contents: write
  actions: write   # self-dispatch
concurrency:
  group: rlchess
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: the apt Stockfish build is part of the frozen eval protocol
    timeout-minutes: 30   # ~16 min of work
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # hot state: newest cache entry; a miss falls back to KV inside the worker
      - uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            weights.json
            buffer.jsonl
          key: rlchess-state-v4-${{ github.run_id }}
          restore-keys: rlchess-state-v4-
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q stockfish
          echo /usr/games >> "$GITHUB_PATH"
      - run: which stockfish && (echo uci | stockfish | head -1) && nproc && cat /proc/cpuinfo | grep -m1 'model name'
      - run: npm ci
      # restore → 3 × (4 play shards in parallel, one per core → train) → 4 eval shards in parallel → publish.
      # The page's compute map: vmstat samples CPU and memory every 5 s (in a subshell, so `wait` doesn't wait on it) and each phase logs its start.
      - run: |
          (TZ=UTC vmstat -n -t 5 > vmstat.log &)
          npm run restore
          for c in 1 2 3; do
            echo "play $(date +%s)" >> phases.log
            for i in 0 1 2 3; do npm run play -- $i & done; wait
            echo "train $(date +%s)" >> phases.log
            npm run train
          done
          echo "eval $(date +%s)" >> phases.log
          for i in 0 1 2 3; do npm run eval -- $i & done; wait
          echo "publish $(date +%s)" >> phases.log
          npm run publish
          pkill -x vmstat || true
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            weights.json
            buffer.jsonl
          key: rlchess-state-v4-${{ github.run_id }}
      # each run schedules the next one itself: at once after a success, at the 20-minute mark after a failure;
      # the dispatch is retried, since a single API error (a 502 on 2026-11-04) would otherwise end the chain
      - if: always()
        run: |
          [ "${{ job.status }}" = success ] || sleep $(( 1200 - ($(date +%s) - START) > 0 ? 1200 - ($(date +%s) - START) : 0 ))
          for i in 1 2 3 4 5; do gh workflow run loop.yml --ref main && exit 0; sleep 60; done; exit 1
        env:
          GH_TOKEN: ${{ github.token }}

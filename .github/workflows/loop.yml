name: loop
# Runs chain themselves (each dispatches the next 20 minutes after its own start; ~72/day fits the free KV write budget). No cron: GitHub's is best-effort.
on:
  workflow_dispatch:
run-name: full
permissions:
  contents: write
  actions: write   # self-dispatch
concurrency:
  group: rlchess
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04   # pinned: the apt Stockfish build is part of the frozen eval protocol
    timeout-minutes: 30   # ≤ 6 min of work, then idles out the 20-minute slot before dispatching the next run
    steps:
      - run: echo "START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # hot state: newest cache entry; a miss falls back to KV inside the worker
      - uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            weights.json
            buffer.jsonl
          key: rlchess-state-v3-${{ github.run_id }}
          restore-keys: rlchess-state-v3-
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q stockfish
          echo /usr/games >> "$GITHUB_PATH"
      - run: which stockfish && (echo uci | stockfish | head -1) && nproc && cat /proc/cpuinfo | grep -m1 'model name'
      - run: npm ci
      # restore → 3 × (4 play shards in parallel, one per core → train) → 4 eval shards in parallel → publish
      - run: |
          npm run restore
          for c in 1 2 3; do
            for i in 0 1 2 3; do npm run play -- $i & done; wait
            npm run train
          done
          for i in 0 1 2 3; do npm run eval -- $i & done; wait
          npm run publish
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state.json
            weights.json
            buffer.jsonl
          key: rlchess-state-v3-${{ github.run_id }}
      # each run schedules the next one itself, 20 minutes after its own start
      - if: always()
        run: |
          sleep $(( 1200 - ($(date +%s) - START) > 0 ? 1200 - ($(date +%s) - START) : 0 ))
          gh workflow run loop.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
